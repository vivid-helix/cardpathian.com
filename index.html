<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<noscript><meta http-equiv="refresh" content="5;url=https://vividhelix.com/"></noscript>
<title>Cardpathian</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5rem; background: #0e0e12; color: #e8e6e3;
    font-family: Georgia, 'Times New Roman', serif; text-align: center;
  }
  h1 { font-size: clamp(2rem, 8vw, 4rem); letter-spacing: 0.35em; padding-left: 0.35em; margin: 0; font-weight: 400; }
  p {
    margin: 0; color: #8a867f; font-size: 0.95rem; letter-spacing: 0.08em;
    font-family: Helvetica, Arial, sans-serif;
  }
  a { color: #8a867f; text-decoration: none; border-bottom: 1px solid #3a3a40; padding-bottom: 2px; }
  a:hover { color: #e8e6e3; }
  #count { color: #e8e6e3; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>CARDPATHIAN</h1>
<p>Redirecting to <a href="https://vividhelix.com/">vividhelix.com</a> in <span id="count">5</span> seconds</p>
<script>
  (function () {
    var n = 5;
    var el = document.getElementById('count');
    var t = setInterval(function () {
      n -= 1;
      if (n <= 0) {
        clearInterval(t);
        window.location.replace('https://vividhelix.com/');
        return;
      }
      el.textContent = n;
    }, 1000);
  })();
</script>
</body>
</html>
